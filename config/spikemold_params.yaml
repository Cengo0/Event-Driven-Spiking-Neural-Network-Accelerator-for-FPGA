architecture:
  neurons_per_group: 128
  group_sizes:
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  max_fanout_inter: 32      # increased from 16: allows higher fanout from active blocks without extra cycles
  spike_buffer_depth: 128   # increased from 64: better handling of input_event_count bursts (rate conv → FC)
router:
  mapping_mode: table
  direct_map_windows: 4
  max_fanout: 64            # increased from 32: supports higher activity per commit window in hybrid block case
  delay_width: 8
  conn_ram_style: block
neuron_groups:
- name: visible_output
  size: 512
- name: input
  size: 512
- name: capacity_reserve
  size: 3866
connections:
- name: input_to_visible_output
  src_group: 1
  dst_group: 0
weight_memory:
  weight_bits: 8
  time_embedding: true
  auxiliary_storage: lutram
trace_maintenance:
  mode: global
  active_clear_threshold: 0
weight_tiling:
  enable: true
  large_only: true
  large_conn_min_weights: 65536
  src_chunk: 256        # increased from 196: larger active tile for feat→16k hidden (fewer tiles, lower commit/router pressure for ~3k–4k active cases)
  dst_chunk: 192        # increased from 128: pairs with src for better coverage of 512→16384 logical block connections
  double_buffer: false
widths:
  data_width: 16
  weight_width: 8
  threshold_width: 16
  leak_width: 8
  refrac_width: 8
weights:
  max_weight: 255
  min_weight: 0
  weight_with_flag_width: 9
hls:
  hls_weight_width: 8
  fixed_point_frac_bits: 8
  smoke_commands_enable: false
  cnn_descriptor_page_enable: true
target:
  fpga_part: xc7z020clg400-1
  clock_period_ns: 12.5
  board: tul.com.tw:pynq-z2:part0:1.0
